# Model registry: provider routes for the swarm.
# Predefined models and credential env names; priority is the fallback order.
# Free providers use low-token models at low effort; paid providers use
# medium-tier models at medium effort. Every route covers all think levels.
# `effort`: provider-side reasoning effort hint (low/medium/high).
# `evidence`: user (user-specified), web (searched Sep 2026), assumed (verify),
#             verified live 2026-10-01 (probe against the provider).
# Provider routes are available to ModelDelegate; specialist assignments live
# in Agents/*/agent.yaml. Services below use credentials without a chat model.
version: 1

providers:
  # ---- Paid: medium tier, medium effort ----
  - name: openai:gpt-4o-mini
    provider: openai
    api_key_env: OPENAI_API_KEY
    effort: low
    think_levels: ["off", low, medium, high, xhigh]
    priority: 73
    evidence: existing agent manifests and provider catalog

  - name: openai:gpt-4o
