# Local SearXNG for WebSearch development. Copy docker/.env.example → docker/.env.
name: swarm-searxng

services:
  searxng:
    build: .
    image: websearch-searxng:local
    container_name: websearch-searxng
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: "${SEARXNG_SECRET:?create docker/.env with SEARXNG_SECRET}"
    ports:
      - "127.0.0.1:8888:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
