name: Feature
description: Propose a change to the swarm runtime, agents, or docs.
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Describe the problem first, then the proposed change.
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - SDK (`src/swarm_sdk`)
        - Orchestrator / plan
        - Agents / coordination
        - Benchmarks
        - WebSearch / Prediction / Newsletter
        - Docs / GitHub
        - Other
    validations:
      required: true
