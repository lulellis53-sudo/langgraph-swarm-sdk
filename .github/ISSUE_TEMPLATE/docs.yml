name: Docs
description: README, AGENTS.md, or GitHub template fixes.
title: "[docs] "
labels: ["documentation"]
body:
  - type: textarea
    id: location
    attributes:
      label: File or section
      placeholder: README.md, AGENTS.md, Documents/…
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is wrong or missing
    validations:
      required: true
