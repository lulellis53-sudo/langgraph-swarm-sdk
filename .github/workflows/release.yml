name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: "Gate: tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install dev dependencies
        run: uv sync --extra dev --frozen
      - name: Run tests
        run: uv run pytest Agents/benchmark/tests -q

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Build distributions
        run: uv build
      - name: Check metadata freshness
        run: |
          # Fail if the tag version does not match pyproject version
          TAG="${GITHUB_REF_NAME#v}"
          PROJ="$(grep -m1 '^version' pyproject.toml | sed 's/version = "\(.*\)"/\1/')"
          if [ "$TAG" != "$PROJ" ]; then
            echo "Tag v$TAG does not match pyproject version $PROJ" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      # Required for PyPI Trusted Publishing (OIDC)
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
