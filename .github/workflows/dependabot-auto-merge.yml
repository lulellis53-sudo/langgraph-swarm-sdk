name: Dependabot auto-merge

# Dependabot PRs get a read-only token under pull_request; this job never checks out PR code.
on: pull_request_target # zizmor: ignore[dangerous-triggers]

permissions: {}

jobs:
  auto-merge:
    name: Auto-merge safe updates
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'lulellis53-sudo/langgraph-swarm-sdk'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Metadata only: this job never checks out or runs PR code.
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Auto-merge waits for required status checks, so it is only as safe as branch protection.
      - name: Enable auto-merge for patch and minor updates
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"
