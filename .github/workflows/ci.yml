name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.14"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14.5"
          enable-cache: true
      - name: Install dev dependencies
        run: uv sync --extra dev --frozen
      - name: Ruff check
        run: uv run ruff check src Agents/benchmark Main
      - name: YAML lint
        run: uv run yamllint .

  tomlcheck:
    name: TOML format (taplo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14.5"
          enable-cache: true
      - name: Install dev dependencies
        run: uv sync --extra dev --frozen
      - name: Taplo format check
        run: uv run taplo format --check

  typecheck:
    name: Type check (ty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14.5"
          enable-cache: true
      - name: Install dev dependencies
        run: uv sync --extra dev --frozen
      - name: ty check
        run: uv run ty check src Agents/benchmark Main

  agents-schema:
    name: Agent manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14.5"
          enable-cache: true
      - name: Install dev dependencies
        run: uv sync --extra dev --frozen
      - name: Validate agent.yaml and coordination.yaml
        run: uv run python -m swarm_sdk.agents.validate

  test:
    name: Tests (pytest, Python 3.14)
    runs-on: ubuntu-latest
    env:
      # Fail loudly if the runner's Python cannot load sqlite_vec for real,
      # instead of letting those tests skip silently.
      SWARM_REQUIRE_SQLITE_EXT: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14.5"
          enable-cache: true
      - name: Report sqlite3 capability
        run: |
          uv run python - <<'PY'
          import sqlite3, sysconfig
          conn = sqlite3.connect(":memory:")
          print("enable_load_extension:", hasattr(conn, "enable_load_extension"))
          print("sqlite_version:", sqlite3.sqlite_version)
          print("configure_args:", sysconfig.get_config_var("CONFIG_ARGS") or "")
          PY
      - name: Install dev dependencies
        run: uv sync --extra dev --frozen
      - name: Run tests
        run: uv run pytest Agents/benchmark/tests -q

  benchmark:
    name: Benchmarks (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14.5"
          enable-cache: true
      - name: Install dev dependencies
        run: uv sync --extra dev --frozen
      - name: Run benchmark tasks
        run: uv run pytest Agents/benchmark -q

  build:
    name: Build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14.5"
          enable-cache: true
      - name: Build distributions
        run: uv build
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
