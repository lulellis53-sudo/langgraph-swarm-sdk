name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.14"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14.5"
          enable-cache: true
      - name: Install dev dependencies
        run: uv sync --extra dev --frozen
      - name: Ruff check
        run: uv run ruff check src Agents/tests Agents/benchmark Main
      - name: YAML lint
        run: uv run yamllint .

  tomlcheck:
    name: TOML format (taplo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14.5"
          enable-cache: true
      - name: Install dev dependencies
        run: uv sync --extra dev --frozen
      - name: Taplo format check
        run: uv run taplo format --check

  typecheck:
    name: Type check (ty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14.5"
          enable-cache: true
      - name: Install dev dependencies
        run: uv sync --extra dev --frozen
      - name: ty check
        run: uv run ty check src Agents/tests Agents/benchmark Main

  agents-schema:
    name: Agent manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14.5"
          enable-cache: true
      - name: Install dev dependencies
        run: uv sync --extra dev --frozen
      - name: Validate agent.yaml and coordination.yaml
        run: uv run python -m swarm_sdk.agents.validate

  test:
    name: Tests (pytest, Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14.5"
          enable-cache: true
      - name: Install dev dependencies
        run: uv sync --extra dev --frozen
      - name: Run tests
        run: uv run pytest Agents/tests -q

  benchmark:
    name: Benchmarks (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14.5"
          enable-cache: true
      - name: Install dev dependencies
        run: uv sync --extra dev --frozen
      - name: Run benchmark tasks
        run: uv run pytest Agents/benchmark -q

  build:
    name: Build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14.5"
          enable-cache: true
      - name: Build distributions
        run: uv build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
