name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.14"

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - name: Ruff check
        run: uv run ruff check src Agents/benchmark Main
      - name: Validate YAML syntax
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import yaml

          roots = (Path(".github"), Path("Main/config"), Path("Agents"))
          files = [path for root in roots for pattern in ("*.yml", "*.yaml") for path in root.rglob(pattern)]
          for path in sorted(set(files)):
              yaml.safe_load(path.read_text(encoding="utf-8"))
          print(f"Validated {len(set(files))} YAML files")
          PY

  tomlcheck:
    name: TOML format (taplo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - name: Taplo format check
        run: uv run taplo format --check

  typecheck:
    name: Type check (ty)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - name: ty check
        run: uv run ty check src Agents/benchmark Main

  agents-schema:
    name: Agent manifests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - name: Validate agent.yaml and coordination.yaml
        run: uv run python -m swarm_sdk.agents.validate

  test:
    name: Tests (pytest, Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Fail loudly if the runner's Python cannot load sqlite_vec for real,
      # instead of letting those tests skip silently.
      SWARM_REQUIRE_SQLITE_EXT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - name: Report sqlite3 capability
        run: |
          uv run python - <<'PY'
          import sqlite3, sysconfig
          conn = sqlite3.connect(":memory:")
          print("enable_load_extension:", hasattr(conn, "enable_load_extension"))
          print("sqlite_version:", sqlite3.sqlite_version)
          print("configure_args:", sysconfig.get_config_var("CONFIG_ARGS") or "")
          PY
      - name: Run tests
        run: uv run pytest Agents/benchmark/tests -q

  benchmark:
    name: Benchmarks (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          extras: dev redis
      - name: Run benchmark tests
        run: uv run pytest Agents/benchmark -q
      - name: Measure Redis cache paths
        run: >-
          PYTHONPATH=Agents:. uv run python
          Agents/benchmark/Tasks/redis_cache/benchmark_redis_cache.py --write-results
        env:
          REDIS_URL: redis://localhost:6379/0
      - name: Upload Redis cache benchmark report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: redis-cache-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: Agents/benchmark/results/redis_cache/latest.json
          if-no-files-found: ignore

  build:
    name: Build wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          sync: "false"
      - name: Build distributions
        run: uv build
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  workflows:
    name: Workflow lint (actionlint, zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          persona: regular

  docker:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.app
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Single required check for branch protection and Dependabot auto-merge.
  ci-ok:
    name: CI OK
    if: always()
    needs: [lint, tomlcheck, typecheck, agents-schema, test, benchmark, build, workflows, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | python3 -c 'import json,sys; r={k:v["result"] for k,v in json.load(sys.stdin).items()}; print(r); sys.exit(any(v!="success" for v in r.values()))'
