name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.14"

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python
      - name: Ruff check
        run: uv run ruff check src Agents/benchmark Main
      - name: Validate YAML syntax
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import yaml

          roots = (Path(".github"), Path("Main/config"), Path("Agents"))
          files = [path for root in roots for pattern in ("*.yml", "*.yaml") for path in root.rglob(pattern)]
          for path in sorted(set(files)):
              yaml.safe_load(path.read_text(encoding="utf-8"))
          print(f"Validated {len(set(files))} YAML files")
          PY

  tomlcheck:
    name: TOML format (taplo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python
      - name: Taplo format check
        run: uv run taplo format --check

  typecheck:
    name: Type check (ty)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python
      - name: ty check
        run: uv run ty check src Agents/benchmark Main

  agents-schema:
    name: Agent manifests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python
      - name: Validate agent.yaml and coordination.yaml
        run: uv run python -m swarm_sdk.agents.validate

  test:
    name: Tests (pytest, Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Fail loudly if the runner's Python cannot load sqlite_vec for real,
      # instead of letting those tests skip silently.
      SWARM_REQUIRE_SQLITE_EXT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python
      - name: Report sqlite3 capability
        run: |
          uv run python - <<'PY'
          import sqlite3, sysconfig
          conn = sqlite3.connect(":memory:")
          print("enable_load_extension:", hasattr(conn, "enable_load_extension"))
          print("sqlite_version:", sqlite3.sqlite_version)
          print("configure_args:", sysconfig.get_config_var("CONFIG_ARGS") or "")
          PY
      - name: Run tests
        run: uv run pytest Agents/benchmark/tests -q

  benchmark:
    name: Benchmarks (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python
        with:
          extras: dev redis
      - name: Run benchmark tests
        run: uv run pytest Agents/benchmark -q
      - name: Measure Redis cache paths
        run: >-
          PYTHONPATH=Agents:. uv run python
          Agents/benchmark/Tasks/redis_cache/benchmark_redis_cache.py --write-results
        env:
          REDIS_URL: redis://localhost:6379/0
      - name: Upload Redis cache benchmark report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: redis-cache-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: Agents/benchmark/results/redis_cache/latest.json
          if-no-files-found: ignore

  build:
    name: Build wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python
        with:
          sync: "false"
      - name: Build distributions
        run: uv build
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
