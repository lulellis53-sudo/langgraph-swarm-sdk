line-length = 100
target-version = "py315"
src = [
  "Core/Sdk",
  "Core/Orchestration",
  "Core/benchmark",
  "Core/Lang",
  "Core/tests",
  "Agents/tests",
  "Agents/_test",
]
extend-exclude = ["Core/Sdk/swarm_sdk/pb", ".pixi"]

[lint]
select = ["E", "F", "I", "UP"]

[lint.per-file-ignores]
"Agents/_test/conftest.py" = ["E402"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
