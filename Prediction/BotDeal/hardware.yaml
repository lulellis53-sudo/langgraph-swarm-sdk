# BotDeal hardware catalog — single source of truth for the deal-hunting stack.
# Loaded by Prediction.BotDeal.hardware (Python dataclasses in Prediction.br_hardware
# stay as the offline/test fallback). Prices are BRL. Secrets never go here.
version: 1

products:
