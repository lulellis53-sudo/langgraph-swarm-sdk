  - {name: terabyte,    domain: terabyteshop.com.br,   kind: retailer}
  - {name: pichau,      domain: pichau.com.br,         kind: retailer}
  - {name: amazon-br,   domain: amazon.com.br,         kind: retailer}
  - {name: magalu,      domain: magazineluiza.com.br,  kind: retailer}
  - {name: mercadolivre, domain: mercadolivre.com.br,  kind: marketplace}
  - {name: casasbahia,  domain: casasbahia.com.br,     kind: retailer}
  - {name: olx,         domain: olx.com.br,            kind: marketplace}
  - {name: promobit,    domain: promobit.com.br,       kind: community}
  - {name: x,           domain: x.com,                 kind: social}
  - {name: telegram,    domain: t.me,                  kind: social}

# Telegram sniper: bot watches BR promo channels, parses BRL prices, and
# alerts when a floor lands in FLOOR_TARGETS. Token comes from the Keychain
# (TELEGRAM_BOT_TOKEN via swarm-vault), never from this file. Channels are
# public promo channels the bot should sniff (or where it is admin).
telegram:
  enabled: false          # flip after TELEGRAM_BOT_TOKEN is stored
  poll_timeout_s: 30
  alert_chat: ""          # chat id or @channel for the sniper's own alerts
  channels: []            # e.g. ["@promocoeseofertasbr", "@hardwardealsbr"]

# X.com deal aggregators: handles that repost BR hardware offers. Populated by
# the discovery lane ("find aggregators on x.com"); verified against search hits.
aggregators: []

# User-supplied low-floor ranges in BRL: a floor at or below `high` is a good
# deal ("low"), at or below `low` is exceptional. Absent = learn from medians.
floor_targets:
  rtx-5090: {low: 18000, high: 19000}

# Misparse guards: snippet prices outside the range are discarded.
plausible:
  rtx-5090: [8000, 45000]
  rtx-5080: [5000, 20000]
  rtx-5070-ti: [4000, 10000]
  rtx-5070: [3000, 7000]
  rtx-5060: [1800, 4500]
  rtx-5060-ti: [2500, 6000]
  rtx-5000-ada: [10000, 40000]
  ryzen-5-9600x: [1000, 2500]
  ryzen-7-9700x: [1500, 3000]
  ryzen-7-9800x: [1800, 3200]
  ryzen-9-9900x: [2200, 4000]
  ryzen-9-9950x: [3200, 6000]
  ryzen-7-9800x3d: [2800, 5000]
  ryzen-7-9850x3d: [3000, 5200]
  ryzen-9-9950x3d: [4500, 8000]
  ryzen-9-9950x3d2: [5500, 9500]
  ddr5-1x8gb: [120, 800]
  ddr5-2x8gb: [250, 1500]
  ddr5-1x16gb: [200, 1200]
  ddr5-2x16gb: [350, 2500]
  ddr5-1x32gb: [350, 2000]
  ddr5-2x32gb: [600, 5000]
  ddr5-1x64gb: [700, 4000]

# Deal baselines in BRL for the median-ratio report; null = learn from the
# run's median. The rtx-5090 low-floor range above is the user's target.
baselines:
  rtx-5060: 2400
  rtx-5090: 22000
  ddr5-1x8gb: null
  ddr5-2x8gb: null
  ddr5-1x16gb: null
  ddr5-2x16gb: null
  ddr5-1x32gb: null
  ddr5-2x32gb: null
  ddr5-1x64gb: null
