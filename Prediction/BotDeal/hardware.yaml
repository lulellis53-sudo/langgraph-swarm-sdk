  - {sku: ddr5-1x32gb, name: DDR5 1x32GB, category: memory, terms: [DDR5 32GB, memoria ddr5 32gb]}
  - {sku: ddr5-2x32gb, name: DDR5 2x32GB, category: memory, terms: [DDR5 2x32GB, kit ddr5 64gb]}
