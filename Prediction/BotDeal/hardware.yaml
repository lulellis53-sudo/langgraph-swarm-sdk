  - {sku: rtx-5070-ti,   name: NVIDIA GeForce RTX 5070 Ti, category: gpu, terms: [RTX 5070 Ti]}
  - {sku: rtx-5070,      name: NVIDIA GeForce RTX 5070, category: gpu,    terms: [RTX 5070]}
  - {sku: rtx-5060,      name: NVIDIA GeForce RTX 5060, category: gpu,    terms: [RTX 5060]}
  - {sku: rtx-5060-ti,   name: NVIDIA GeForce RTX 5060 Ti, category: gpu, terms: [RTX 5060 Ti]}
  - {sku: rtx-5000-ada,  name: NVIDIA RTX 5000 Ada,     category: gpu,    terms: [RTX 5000 Ada]}
  - {sku: ryzen-5-9600x,   name: AMD Ryzen 5 9600X,   category: cpu, terms: [Ryzen 5 9600X]}
  - {sku: ryzen-7-9700x,   name: AMD Ryzen 7 9700X,   category: cpu, terms: [Ryzen 7 9700X]}
