# Pixi workspace for ~/Desktop/Workspace (Python 3.15, osx-64).
# Run: pixi run check | pixi run test | pixi run benchmark | pixi run python ...
# Lang stack: Core/Sdk + Core/Orchestration (editable). Tool configs: ruff.toml, ty.toml.

[workspace]
name = "langgraph-swarm-sdk"
description = "Agent workspace: LangGraph orchestration with Python tooling."
channels = ["conda-forge"]
platforms = ["osx-64"]
version = "0.1.0"
requires-pixi = ">=0.81"
# Parallel solves/downloads: set in ~/.pixi/config.toml (downloads=16, solves=4 on this host).

[dependencies]
python = "3.15.*"
ruff = "==0.17.0"
ty = "*"
biome = "*"
oxlint = "*"
python-duckdb = ">=1.5.6,<2"
jq = ">=1.8.2,<2"
xh = ">=0.26.2,<0.27"
curl = ">=8.23.0,<9"
swig = ">=4.5.1,<5"
setuptools = ">=84.0.0,<85"
wheel = ">=0.48.0,<0.49"
rust = "1.99.*"

[pypi-dependencies]
langgraph-swarm-sdk = { path = "./Core/Sdk", editable = true }
core-orchestration = { path = "./Core/Orchestration", editable = true }
langextract = ">=1.7"
ormsgpack = { path = "./wheels/ormsgpack-1.12.2-cp315-cp315-macosx_10_12_x86_64.whl" }
faiss = { path = "./wheels/faiss-1.15.1-cp315-cp315-macosx_26_0_x86_64.whl" }
lifeguard-lazy-imports = ">=0.5.0, <0.6"
loguru = ">=0.7.3, <0.8"
logfire = ">=5.2.0, <6"
prometheus-client = ">=0.26.0, <0.27"
opentelemetry-api = ">=1.45.1, <2"
opentelemetry-sdk = ">=1.45.1, <2"
opentelemetry-exporter-otlp = ">=1.45.1, <2"
hypothesis = ">=6.170.0, <7"
pytest = ">=9.1.1, <10"
pytest-asyncio = ">=1.1.0, <2"
pydantic-settings = ">=2.10"
pyyaml = ">=6.0"

[activation]
env = {
  PATH = "/Users/usuario/.local/opt/node-26.11.1-avx2/bin:$PATH",
  PYTHONPATH = "Core/Sdk:Core/Orchestration:Agents:.",
  PYTHONUNBUFFERED = "1",
  TY_CONFIG_FILE = "ty.toml",
}

[tasks]
node-version = { cmd = "python -c \"import subprocess, sys; v=subprocess.check_output(['node', '--version'], text=True); sys.exit(0 if '26.11.1' in v else 1)\"" }
rust-version = "rustc --version"
lint = { cmd = "ruff check --config ruff.toml Core/Sdk Core/Orchestration Core/benchmark Core/Lang Core/tests Agents/_test", inputs = ["ruff.toml", "**/*.py"] }
format = "ruff format --config ruff.toml Core/Sdk Core/Orchestration Core/benchmark Core/Lang Core/tests Agents/_test"
format-check = { cmd = "ruff format --check --config ruff.toml Core/Sdk Core/Orchestration Core/benchmark Core/Lang Core/tests Agents/_test", inputs = ["ruff.toml", "**/*.py"] }
types = { cmd = "ty check --config-file ty.toml", inputs = ["ty.toml", "**/*.py"] }
biome-check = { cmd = "biome check .", inputs = ["biome.json"] }
oxlint-check = { cmd = "oxlint ." }
test = {
  cmd = "python -m pytest --import-mode=importlib Core/Orchestration Core/tests Core/benchmark -q --tb=short",
  inputs = ["pyproject.toml", "pixi.toml", "ruff.toml", "ty.toml", "Core/**"],
}
benchmark = "python -m Core.benchmark.run --task all"
check = { depends-on = ["lint", "format-check", "types", "biome-check", "oxlint-check"] }
