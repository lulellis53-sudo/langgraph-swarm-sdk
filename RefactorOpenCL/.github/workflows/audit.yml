name: Dependency audit

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths: [uv.lock, pyproject.toml]

permissions:
  contents: read

jobs:
  audit:
    name: uv audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Informational: some advisories have no fix yet, so this must not gate merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          sync: "false"
      - run: uv audit --frozen
