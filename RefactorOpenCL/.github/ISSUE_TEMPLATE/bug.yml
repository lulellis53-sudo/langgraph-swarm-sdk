name: Bug
description: Something is broken in the SDK, CLI, or swarm runtime.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Do not paste API keys or `.env` contents.
  - type: checkboxes
    attributes:
      label: Checks
      options:
        - label: I searched existing issues
          required: true
        - label: This report contains no secrets or credential values
          required: true
  - type: textarea
    id: current
    attributes:
      label: Current behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. `uv sync --extra dev`
        2. Run …
        3. See error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - OS:
        - Python:
        - uv:
        - extras:
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or traceback
      render: text
    validations:
      required: false
