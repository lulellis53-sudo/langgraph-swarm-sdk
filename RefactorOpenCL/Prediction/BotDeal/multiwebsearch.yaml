# MultiWebsearch pipeline: ONE prompt template fanned out to ALL searchers,
# then the scraper chain (providers.yaml crawlers.order), then normalization.
# Consumed by Prediction.BotDeal.pipeline; the LLM-autonomous summary goes to
# the orchestrator each turn, whose findings feed back into WebSearch + the
# forecast engine (hardware.yaml ranges, parsers, query windows).
version: 1

prompt: "{model} preço oferta"
# OR-aliases appended to each model when building the query (X3D cards are
# commonly typed XD on shops and forums).
aliases:
  X3D: [XD]

searchers: all          # all enabled searchers in providers.yaml (tavily, exa, jina, brave, ddglite, ...)
window_days: 7          # 0 = no after:/before: bounds
per_site: true          # one query per catalog site (site: dork); false = one siteless query
scrape:
  top: 3                # crawl + extract the first N hits per SKU
  timeout_s: 15
skus:                   # empty = every SKU in hardware.yaml
  - rtx-5090
  - ryzen-9-9950x
  - ryzen-7-9800x3d
  - ddr5-2x16gb
