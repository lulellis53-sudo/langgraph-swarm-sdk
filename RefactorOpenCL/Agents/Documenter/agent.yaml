version: "1"
name: Documenter
role: maintain_documentation

model: openai:gpt-6-luna
# api_endpoint: POST https://api.openai.com/v1/chat/completions
api_key_env: CODEX_OAUTH_TOKEN
effort: low
think_level: low

token_budget:
  max_prompt: 2048
  max_completion: 512

tasks:
  - id: sync_docs
    description: >-
      Update documentation to accurately reflect the current state of
      the code, API, or configuration.
    outputs:
      - changed_files
      - coverage_summary

  - id: generate_reference
    description: >-
      Generate or improve reference docs, docstrings, API specs, or
      changelogs for a given module or release.
    outputs:
      - changed_files

capabilities:
  - markdown
  - docstring_writing
  - changelog
  - openapi
