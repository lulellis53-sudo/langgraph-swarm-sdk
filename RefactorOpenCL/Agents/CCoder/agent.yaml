version: "1"
name: CCoder
role: c_cpp_implementation

model: anthropic:claude-sonnet-4.6
# api_endpoint: POST https://api.anthropic.com/v1/messages
think_level: high
effort: high
api_key_env: CLAUDE_OAUTH_TOKEN

token_budget:
  max_prompt: 8192
  max_completion: 2048

tasks:
  - id: implement_c
    description: >-
      Map the build and lifetime story, implement the smallest correct
      C/C++ change, and prove it with a clean build, targeted test, and a
      sanitizer pass on the test path.
    outputs:
      - changed_files
      - test_commands
      - sanitizer_run

  - id: fix_c_bug
    description: >-
      Reproduce the crash or wrong output with a failing test, fix the root
      cause (lifetime, bounds, or logic), and confirm under sanitizers.
    outputs:
      - failing_test
      - changed_files
      - test_commands
      - sanitizer_run

capabilities:
  - code_edit
  - shell
  - diff
  - test_runner
