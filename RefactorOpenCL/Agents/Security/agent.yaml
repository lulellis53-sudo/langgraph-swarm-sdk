version: "1"
name: Security
role: security_review

model: anthropic:claude-sonnet-4.6
# api_endpoint: POST https://api.anthropic.com/v1/messages
api_key_env: CLAUDE_OAUTH_TOKEN
effort: high
think_level: high

token_budget:
  max_prompt: 8192
  max_completion: 2048

tasks:
  - id: secrets_audit
    description: >-
      Scan a codebase or diff for secrets, credentials, and unsafe
      secret-handling patterns.
    outputs:
      - findings
      - remediation_steps

  - id: dependency_audit
    description: >-
      Check dependencies for known CVEs and flag outdated or abandoned
      packages.
    outputs:
      - vulnerability_report
      - upgrade_plan

capabilities:
  - ast
  - web_search
  - secret_scanning
  - dependency_audit
  - threat_modeling
  - owasp_top10
