version: "1"
name: Newsletter
role: digest_generation

model: openai:gpt-6-luna
# api_endpoint: POST https://api.openai.com/v1/chat/completions
api_key_env: CODEX_OAUTH_TOKEN
effort: low
think_level: low

token_budget:
  max_prompt: 4096
  max_completion: 2048

tasks:
  - id: newsletter_mvp
    description: >-
      Assemble a digest from titled source snippets the task supplies.
      Dedupe lines, keep attribution, and return the body plus metadata.
      Do not fetch or send.
    outputs:
      - digest_markdown
      - metadata

capabilities:
  - markdown
