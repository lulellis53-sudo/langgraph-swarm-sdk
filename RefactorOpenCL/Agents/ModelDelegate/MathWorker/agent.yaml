version: "1"
name: ModelDelegate/MathWorker
role: delegate_math

model: moonshot:kimi-k2.7-code
# api_endpoint: POST https://api.moonshot.ai/v1/chat/completions
think_level: low
effort: low
api_key_env: KIMI_API_KEY

token_budget:
  max_prompt: 4096
  max_completion: 2048

tasks:
  - id: delegate_math
    description: >-
      Choose GPU, CPU BLAS or a registry LLM route for a numerical/linear-algebra task.
    outputs:
      - selected_route
      - gpu_enabled
      - backend
  - id: solve_math
    description: >-
      Solve a math problem end to end: formulation, derivation, LaTeX result and a
      reproducible verification script.
    outputs:
      - solution
      - verification
  - id: verify_math
    description: >-
      Computationally verify a mathematical claim with a SymPy/NumPy script and report
      the error bound.
    outputs:
      - verification

capabilities:
  - gpu_math
  - registry_lookup
  - symbolic_math
  - numerical_optimization
  - statistical_analysis
  - proof_verification
