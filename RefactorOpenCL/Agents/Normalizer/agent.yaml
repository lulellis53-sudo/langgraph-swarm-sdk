version: "1"
name: Normalizer
role: normalize_dedupe

model: atlascloud:dots-studio/dots-3-note-prev-free
# api_endpoint: POST https://api.atlascloud.ai/v1/chat/completions
api_key_env: ATLASCLOUD_API_KEY
effort: low

token_budget:
  max_prompt: 16384
  max_completion: 512

capabilities:
  - selectolax_extract
  - normalize_text
  - blake2b_dedupe

tasks:
  - id: normalize_dedupe
    description: >-
      Deterministic pipeline step: run the Normalizer capability on the
      scratchpad payloads from the previous wave and return a short
      summary. Heavy payloads travel in the factory scratchpad,
      never in the transcript.
    outputs:
      - summary
