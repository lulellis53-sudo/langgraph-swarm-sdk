version: "1"
name: Worktree
role: multi_lane_worktrees

model: openai:gpt-6-luna
api_key_env: CODEX_OAUTH_TOKEN
think_level: medium
effort: medium

token_budget:
  max_prompt: 4096
  max_completion: 1024

tasks:
  - id: lane_audit
    description: >-
      Compare git worktree state to the fixed three-lane map; report drift,
      wrong branches, or extra worktrees. Read-only git unless the user
      approved remediation commands.
    outputs:
      - worktrees
      - drift_findings
      - verification_commands
      - status
      - notes

  - id: integration_window_check
    description: >-
      Assess readiness to merge lane branches toward main or
      integration/all-branches: branch divergence, lockfile ownership, and
      merge order. Propose commands; run mutating git only after approval.
    outputs:
      - merge_order
      - lockfile_owner
      - blockers
      - proposed_commands
      - status
      - notes

capabilities:
  - shell
  - diff
  - file_scoped
