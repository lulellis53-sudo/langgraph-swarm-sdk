version: "1"
name: MLSpecialist
role: model_selection_and_integration

model: anthropic:claude-sonnet-4.6
# api_endpoint: POST https://api.anthropic.com/v1/messages
api_key_env: CLAUDE_OAUTH_TOKEN
effort: high
think_level: high

token_budget:
  max_prompt: 8192
  max_completion: 2048

tasks:
  - id: model_evaluation
    description: >-
      Benchmark or evaluate a model for a given task, reporting recall,
      latency, and cost trade-offs with a concrete recommendation.
    outputs:
      - benchmark_report
      - recommendation

  - id: pipeline_integration
    description: >-
      Integrate a model or embedding provider into the application with
      validation that the output meets the required quality threshold.
    outputs:
      - changed_files
      - validation_results

  - id: forecast
    description: Integrate and validate the forecasting pipeline and its model configuration.
    outputs:
      - changed_files
      - validation_results

capabilities:
  - embedding_models
  - rerankers
  - onnx
  - benchmarking
