version: "1"
name: JSCoder
role: js_ts_implementation

model: zai:glm-5.2
# api_endpoint: https://api.z.ai/api/paas/v4/chat/completions
think_level: high
effort: high
api_key_env: ZHIPU_API_KEY

token_budget:
  max_prompt: 8192
  max_completion: 2048

tasks:
  - id: implement_js
    description: >-
      Read callers and tests, implement the smallest strict-TS change, and
      prove it with the project's targeted check plus one full gate run.
    outputs:
      - changed_files
      - test_commands

  - id: fix_js_bug
    description: >-
      Reproduce with a failing test, fix the root cause, and confirm the
      test passes without disabling types or lint.
    outputs:
      - failing_test
      - changed_files
      - test_commands

capabilities:
  - code_edit
  - shell
  - diff
  - test_runner
