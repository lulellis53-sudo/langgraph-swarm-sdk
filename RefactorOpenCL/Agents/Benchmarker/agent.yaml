version: "1"
name: Benchmarker
role: measured_baselines_and_suite_authoring

model: openai:gpt-6-luna
# api_endpoint: POST https://api.openai.com/v1/chat/completions
api_key_env: CODEX_OAUTH_TOKEN
think_level: medium
effort: medium

token_budget:
  max_prompt: 4096
  max_completion: 1024

tools:
  - run_command
  - view_file
  - write_to_file
  - replace_file_content
  - search_web

tasks:
  - id: define_workload
    description: >-
      Define a fixed workload: inputs, repetitions, environment, and the
      metrics to record. Do not optimize the code.
    outputs:
      - workload
      - metrics

  - id: measure_baseline
    description: >-
      Run the defined workload and record the baseline. Label any number
      that was not measured.
    outputs:
      - baseline
      - environment

  - id: compare_candidates
    description: >-
      Run the same workload on two or more candidates and report the delta
      against the baseline.
    outputs:
      - comparison
      - delta

  - id: author_suite
    description: >-
      Author or extend a reproducible benchmark harness under Agents/benchmark/
      with observability hooks; do not claim speedups without paired runs.
    outputs:
      - harness_paths
      - workload_spec

  - id: regression_gate
    description: >-
      Execute a suite, compare against baseline or noise floor, and emit
      pass/fail with measured deltas only.
    outputs:
      - gate_status
      - metrics_summary

capabilities:
  - benchmarking
  - measurement
  - suite_authoring
