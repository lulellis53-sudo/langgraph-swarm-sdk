[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langgraph-swarm-sdk"
version = "0.1.0"
description = "Canonical swarm_sdk package for ~/Desktop/Workspace (Core/Sdk)."
requires-python = ">=3.15"
dependencies = [
    "langchain-core>=1.4,<2",
    "langgraph>=1.2.15,<2",
    "langgraph-swarm>=0.1",
    "langgraph-supervisor>=0.0.31",
    "pydantic>=2.14.1,<3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
langsmith = ["langsmith>=0.14.9,<0.15"]

[tool.hatch.build.targets.wheel]
packages = ["swarm_sdk"]
