[workspace]
authors = ["Eudora <dantenho@gmail.com>"]
channels = ["conda-forge"]
name = "Orchestration"
platforms = ["osx-64"]
version = "0.1.0"

[tasks]
test = "python -m pytest -q --tb=short"

[dependencies]
python = "3.15.*"

[pypi-dependencies]
langgraph = ">=1.2.15, <2"
