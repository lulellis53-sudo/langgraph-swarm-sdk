# yamllint configuration for this repository.
# Validates .github/workflows/*.yml and other YAML files.
# Run: yamllint .

extends: default

rules:
  line-length:
    max: 120
    level: warning

  indentation:
    spaces: consistent
    indent-sequences: consistent

  truthy:
    # Allow GitHub Actions' `on:` key
    check-keys: false

  comments:
    min-spaces-from-content: 1

  document-start:
    present: false

ignore: |
  .venv/
  node_modules/
