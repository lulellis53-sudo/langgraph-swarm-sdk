# Pixi workspace for ~/Desktop/Workspace (Python 3.15, osx-64).
# Run: pixi run check | pixi run test | pixi run python ...
# PyPI app deps: editable SDK at Core/Sdk (see Core/Sdk/pyproject.toml). Conda: tooling + native libs.

[workspace]
name = "langgraph-swarm-sdk"
description = "Agent workspace: LangGraph orchestration with Python tooling."
channels = ["conda-forge"]
platforms = ["osx-64"]
version = "0.1.0"
requires-pixi = ">=0.81"
# Parallel solves/downloads: set in ~/.pixi/config.toml (downloads=16, solves=4 on this host).

[dependencies]
python = "3.15.*"
ruff = "*"
ty = "*"
biome = "*"
oxlint = "*"
python-duckdb = ">=1.5.6,<2"
jq = ">=1.8.2,<2"
xh = ">=0.26.2,<0.27"
curl = ">=8.23.0,<9"
swig = ">=4.5.1,<5"
setuptools = ">=84.0.0,<85"
wheel = ">=0.48.0,<0.49"
rust = "1.99.*"

[pypi-dependencies]
# Install the SDK tree + its declared runtime deps (Pixi: path + editable).
langgraph-swarm-sdk = { path = "./Core/Sdk", editable = true }
langgraph-supervisor = ">=0.0.31"
langextract = ">=1.7"
# ormsgpack 1.12.2 has no cp315 wheel upstream. Local PyO3 0.28 patch in ./wheels.
ormsgpack = { path = "./wheels/ormsgpack-1.12.2-cp315-cp315-macosx_10_12_x86_64.whl" }
# Faiss 1.15.1 AVX2 + ThinLTO build; links Homebrew libomp at runtime.
faiss = { path = "./wheels/faiss-1.15.1-cp315-cp315-macosx_26_0_x86_64.whl" }
# Workspace-only / not always pulled as transitive deps
lifeguard-lazy-imports = ">=0.5.0, <0.6"
loguru = ">=0.7.3, <0.8"
logfire = ">=5.2.0, <6"
prometheus-client = ">=0.26.0, <0.27"
opentelemetry-api = ">=1.45.1, <2"
opentelemetry-sdk = ">=1.45.1, <2"
opentelemetry-exporter-otlp = ">=1.45.1, <2"
# Test & gate tooling (pixi tasks)
hypothesis = ">=6.170.0, <7"
pytest = ">=9.1.1, <10"
pytest-asyncio = ">=1.1.0, <2"

[activation]
env = {
  PATH = "/Users/usuario/.local/opt/node-26.11.1-avx2/bin:$PATH",
  PYTHONPATH = "Core/Sdk:Agents:.",
  PYTHONUNBUFFERED = "1",
}

[tasks]
node-version = "node --version"
lint = { cmd = "ruff check .", inputs = ["ruff.toml", "**/*.py"] }
format = "ruff format ."
format-check = { cmd = "ruff format --check .", inputs = ["ruff.toml", "**/*.py"] }
types = { cmd = "ty check", inputs = ["ty.toml", "**/*.py"] }
biome-check = { cmd = "biome check .", inputs = ["biome.json"] }
oxlint-check = { cmd = "oxlint ." }
test = {
  cmd = "python -m pytest Core Agents -q --tb=short",
  depends-on = [],
  inputs = ["pyproject.toml", "pixi.toml", "Agents/**", "Core/**"],
}
check = { depends-on = ["lint", "format-check", "types", "biome-check", "oxlint-check"] }
