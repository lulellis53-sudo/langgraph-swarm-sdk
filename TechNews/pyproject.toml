[project]
name = "technews"
version = "0.1.0"
description = "TechNews pipeline: scrape, store, predict, newsletter, humanize, site."
requires-python = ">=3.14.8"
dependencies = [
    "feedparser>=6.0",
    "httpx>=0.28",
    "selectolax>=0.3",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
technews = "technews.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/technews"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "D", "ANN"]
# ``Any`` stays legal: it is only used where a type is genuinely dynamic.
ignore = ["ANN401"]

[tool.ruff.lint.pydocstyle]
# Google convention: summary line, blank line, then ``Args:``/``Returns:``/``Raises:``.
convention = "google"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
# Tests assert behavior; a docstring per test adds noise without information.
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
