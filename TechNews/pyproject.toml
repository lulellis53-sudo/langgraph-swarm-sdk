[project]
name = "technews"
version = "0.1.0"
description = "TechNews pipeline: scrape, store, predict, newsletter, humanize, site."
requires-python = ">=3.14.8"
dependencies = [
    "feedparser>=6.0",
    "httpx>=0.28",
    "selectolax>=0.3",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
technews = "technews.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/technews"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
