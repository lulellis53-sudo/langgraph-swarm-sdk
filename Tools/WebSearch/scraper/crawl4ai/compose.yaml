# Local Crawl4AI for the WebSearcherMCP server (API on 127.0.0.1:11235).
# Run: WebScraper/scripts/compose crawl4ai up -d   (secret CRAWL4AI_API_TOKEN comes from the Keychain)
name: webscraper-crawl4ai

services:
  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: crawl4ai
    restart: unless-stopped
    shm_size: 4gb
    environment:
      CRAWL4AI_API_TOKEN: "${CRAWL4AI_API_TOKEN:?store CRAWL4AI_API_TOKEN in the Keychain (service swarm/CRAWL4AI_API_TOKEN)}"
    ports:
      - "127.0.0.1:11235:11235"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:11235/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
