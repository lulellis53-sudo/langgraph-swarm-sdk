# Local SearXNG for the WebSearcherMCP server (JSON API on 127.0.0.1:8888).
# Run: WebScraper/scripts/compose searxng up -d   (secret SEARXNG_SECRET comes from the Keychain)
name: webscraper-searxng

services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: "${SEARXNG_SECRET:?store SEARXNG_SECRET in the Keychain (service swarm/SEARXNG_SECRET)}"
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - ./limiter.toml:/etc/searxng/limiter.toml:ro
      - searxng-cache:/var/cache/searxng

volumes:
  searxng-cache:
