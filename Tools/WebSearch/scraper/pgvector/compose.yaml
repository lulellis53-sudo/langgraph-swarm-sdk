# Postgres + pgvector for the WebSearcherMCP semantic store (127.0.0.1:5433).
# Run: WebScraper/scripts/compose pgvector up -d   (secret WEBSCRAPER_PG_PASSWORD comes from the Keychain)
name: webscraper-pgvector

services:
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: webscraper-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: webscraper
      POSTGRES_DB: webscraper
      POSTGRES_PASSWORD: "${WEBSCRAPER_PG_PASSWORD:?store WEBSCRAPER_PG_PASSWORD in the Keychain (service swarm/WEBSCRAPER_PG_PASSWORD)}"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webscraper -d webscraper"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
