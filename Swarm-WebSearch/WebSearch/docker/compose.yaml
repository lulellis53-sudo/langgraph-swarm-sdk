services:
  searxng:
    image: ${SEARXNG_IMAGE:-docker.io/searxng/searxng:2025.7.19-b95a3e9}
    container_name: websearch-searxng
    ports:
      - "${SEARXNG_PORT:-8080}:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml
    tmpfs:
      - /tmp
    environment:
      - BASE_URL=${SEARXNG_BASE_URL:-http://localhost:8080/}
      - INSTANCE_NAME=${SEARXNG_INSTANCE_NAME:-WebSearch SearXNG}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
