version: "1"
name: CodeFixer
role: apply_review_fixes
# Plan-orchestrator worker only (handoff graph stays researcher | coder | reviewer).

model: anthropic:claude-sonnet-4.6
think_level: high
effort: high
api_key_env: CLAUDE_OAUTH_TOKEN

token_budget:
  max_prompt: 8192
  max_completion: 2048

tasks:
  - id: apply_review_findings
    description: >-
      Implement Code Reviewer / Reviewer findings (critical and major first)
      as the smallest correct patches; run ruff, ty, focused pytest, and
      agents.validate when manifests change; do not re-review.
    outputs:
      - claimed_files
      - changed_files
      - lint
      - types
      - tests
      - validate
      - test_commands
      - remaining_gaps
      - actuation_method

  - id: apply_in_files
    description: >-
      Apply review findings only in the exclusive files claimed for this step.
    outputs:
      - claimed_files
      - changed_files
      - lint
      - types
      - tests
      - test_commands
      - actuation_method

capabilities:
  - code_edit
  - shell
  - diff
  - test_runner
  - lint
  - typecheck
  - validate
  - file_scoped
