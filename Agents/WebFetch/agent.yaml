version: "1"
name: WebFetch
role: fetch_render

model: inherit

token_budget:
  max_prompt: 16384
  max_completion: 512

capabilities:
  - playwright_fetch
  - http_fetch

tasks:
  - id: fetch_render
    description: >-
      Deterministic pipeline step: run the WebFetch capability on the
      scratchpad payloads from the previous wave and return a short
      summary. Heavy payloads travel in the factory scratchpad,
      never in the transcript.
    outputs:
      - summary
