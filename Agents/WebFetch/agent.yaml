version: '1'
name: WebFetch
role: fetch_render
model: atlascloud:dots-studio/dots-3-note-prev-free
api_key_env: ATLASCLOUD_API_KEY
effort: low
token_budget:
  max_prompt: 16384
  max_completion: 512
capabilities:
- playwright_fetch
- http_fetch
tasks:
- id: fetch_render
  description: 'Deterministic pipeline step: run the WebFetch capability on the scratchpad
    payloads from the previous wave and return a short summary. Heavy payloads travel
    in the factory scratchpad, never in the transcript.'
  outputs:
  - summary
telemetry:
  enabled: true
  metrics:
  - token_count
  - latency_ms
  - throughput_rpm
  - jev_score
  - success_rate
  export_format: json_lines
  log_destination: Benchmarks/telemetry.jsonl
skills:
- skills/SKILL.md
