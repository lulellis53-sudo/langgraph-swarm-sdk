version: "1"
name: math
role: mathematical_modeling
# Reference persona (also mirrored in ModelDelegate's MathWorker matrix).
# Not wired into the handoff swarm: no langgraph_node; participates through
# the plan orchestrator and via ModelDelegate delegate_math dispatch.

model: mistral:ministral-3-8b-latest
think_level: high
effort: high
api_key_env: MISTRAL_API_KEY_2

token_budget:
  max_prompt: 8192
  max_completion: 2048

tasks:
  - id: solve_math
    description: >-
      Solve a mathematical problem end to end: model it, derive the solution
      with explicit steps, and present the result with LaTeX.
    outputs:
      - solution
      - derivation_steps

  - id: verify_math
    description: >-
      Verify a mathematical claim symbolically (SymPy) or numerically
      (mpmath at raised precision); report PROVEN / REFUTED / INCONCLUSIVE.
    outputs:
      - verification_result
      - counterexample_or_proof

  - id: numerical_stability_review
    description: >-
      Review an algorithm for numerical stability: conditioning, cancellation,
      accumulation error, and dtype/precision choices on this AVX2 host.
    outputs:
      - stability_findings
      - recommended_formulation

capabilities:
  - symbolic_math
  - numerical_verification
  - sympy
  - pyarrow_columnar
  - gpu_dispatch_via_modeldelegate
