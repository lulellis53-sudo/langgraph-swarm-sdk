version: "1"
name: math
role: mathematical_modeling

model: moonshot:kimi-k2.7-code
# api_endpoint: POST https://api.moonshot.ai/v1/chat/completions
think_level: high
effort: high
api_key_env: KIMI_API_KEY

token_budget:
  max_prompt: 8192
  max_completion: 2048

tasks:
  - id: solve_math
    description: >-
      Solve a mathematical problem end to end: model it, derive the solution
      with explicit steps, and present the result with the assumptions stated.
    outputs:
      - solution
      - derivation_steps

  - id: verify_math
    description: >-
      Verify a mathematical claim symbolically or numerically and report
      proven, refuted, or inconclusive.
    outputs:
      - verification_result
      - counterexample_or_proof

  - id: numerical_stability_review
    description: >-
      Review an algorithm for numerical stability: conditioning, cancellation,
      accumulation error, and precision choices for the stated runtime.
    outputs:
      - stability_findings
      - recommended_formulation

  - id: verify_with_script
    description: >-
      Run a reproducible Python/SymPy/NumPy script through the isolated
      verification runner and report proven, refuted, or inconclusive with the
      error bound.
    outputs:
      - verification_result
      - script_snippet
      - error_bound

capabilities:
  - symbolic_math
  - numerical_verification
  - hardware_dispatch
  - local_calculation
  - script_verification
