version: "1"
name: math
role: mathematical_modeling

model: mistral:ministral-3-8b-latest
think_level: high
effort: high
api_key_env: MISTRAL_API_KEY_2

token_budget:
  max_prompt: 8192
  max_completion: 2048

tasks:
  - id: solve_math
    description: >-
      Solve a mathematical problem end to end: model it, derive the solution
      with explicit steps, and present the result with the assumptions stated.
    outputs:
      - solution
      - derivation_steps

  - id: verify_math
    description: >-
      Verify a mathematical claim symbolically or numerically and report
      proven, refuted, or inconclusive.
    outputs:
      - verification_result
      - counterexample_or_proof

  - id: numerical_stability_review
    description: >-
      Review an algorithm for numerical stability: conditioning, cancellation,
      accumulation error, and precision choices for the stated runtime.
    outputs:
      - stability_findings
      - recommended_formulation

capabilities:
  - symbolic_math
  - numerical_verification
