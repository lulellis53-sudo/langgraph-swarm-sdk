version: '1'
name: Newsletter
role: digest_generation
model: openai:gpt-6-luna
api_key_env: CODEX_OAUTH_TOKEN
effort: low
think_level: low
token_budget:
  max_prompt: 4096
  max_completion: 2048
tasks:
- id: newsletter_mvp
  description: Assemble a digest from titled source snippets the task supplies. Dedupe
    lines, keep attribution, and return the body plus metadata. Do not fetch or send.
  outputs:
  - digest_markdown
  - metadata
capabilities:
- markdown
telemetry:
  enabled: true
  metrics:
  - token_count
  - latency_ms
  - throughput_rpm
  - jev_score
  - success_rate
  export_format: json_lines
  log_destination: Benchmarks/telemetry.jsonl
skills:
- skills/SKILL.md
