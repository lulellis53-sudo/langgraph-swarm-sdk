version: '1'
name: Planner
role: decompose_goals
model: openai:gpt-6-luna
api_key_env: CODEX_OAUTH_TOKEN
effort: high
think_level: high
token_budget:
  max_prompt: 8192
  max_completion: 2048
tasks:
- id: decompose_goal
  description: "Break a high-level goal into a DAG of concrete, assignable tasks with\
    \ explicit dependencies, acceptance criteria, and \u2014 for Coder work \u2014\
    \ disjoint files so independent steps can share a wave."
  outputs:
  - task_graph
  - dependency_map
  - file_partition
- id: revise_plan
  description: Update the task graph in response to new information, blockers, or
    scope changes.
  outputs:
  - updated_task_graph
  - change_rationale
capabilities:
- planning
- dependency_analysis
- risk_assessment
telemetry:
  enabled: true
  metrics:
  - token_count
  - latency_ms
  - throughput_rpm
  - jev_score
  - success_rate
  export_format: json_lines
  log_destination: Benchmarks/telemetry.jsonl
skills:
- skills/SKILL.md
