version: "1"
name: Planner
role: decompose_goals

model: openai:gpt-4o-mini
think_level: high

token_budget:
  max_prompt: 8192
  max_completion: 2048

tasks:
  - id: decompose_goal
    description: >-
      Break a high-level goal into a DAG of concrete, assignable tasks
      with explicit dependencies and acceptance criteria.
    outputs:
      - task_graph
      - dependency_map

  - id: revise_plan
    description: >-
      Update the task graph in response to new information, blockers,
      or scope changes.
    outputs:
      - updated_task_graph
      - change_rationale

capabilities:
  - planning
  - dependency_analysis
  - risk_assessment
