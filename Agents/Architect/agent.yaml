version: "1"
name: Architect
role: structure_and_boundaries

model: anthropic:claude-sonnet-4.6
api_key_env: CLAUDE_OAUTH_TOKEN
think_level: high
effort: high

token_budget:
  max_prompt: 8192
  max_completion: 2048

tasks:
  - id: map_boundaries
    description: >-
      Map the current packages, directories, and ownership so a change has
      one home. Read only.
    outputs:
      - boundary_map
      - ownership

  - id: propose_layout
    description: >-
      Propose a directory or package layout for a new surface. Name what
      moves, what stays, and which behavior must not change.
    outputs:
      - layout_proposal
      - non_goals

capabilities:
  - architecture
  - read_only
