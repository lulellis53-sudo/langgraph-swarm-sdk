version: "1"
name: Orchestrator
role: coordinate_swarm

model: anthropic:claude-opus-5-5
# api_endpoint: POST https://api.anthropic.com/v1/messages
# Jev hint: POST https://api.typesafe.ai/v1/systemone model jev-latest, key JEV_API_KEY
think_level: medium
effort: medium
api_key_env: CLAUDE_OAUTH_TOKEN

token_budget:
  max_prompt: 8192
  max_completion: 2048

tasks:
  - id: decompose_goal
    description: >-
      Turn a free-text goal into a JSON plan of small parallel steps for the
      swarm: each step names one agent, optional task id, exclusive files,
      a description, and only the step ids it depends on. Sibling Coder
      steps must claim disjoint files. Reply with JSON only.
    outputs:
      - plan_json

  - id: assign_tasks
    description: >-
      Route incoming goals to the correct agents based on the task graph
      and current agent availability.
    outputs:
      - task_assignments
      - dependency_order

  - id: merge_results
    description: >-
      Collect agent outputs and produce a unified result or status report.
    outputs:
      - merged_result
      - blocked_tasks

capabilities:
  - task_routing
  - result_aggregation
  - status_tracking
