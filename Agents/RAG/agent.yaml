version: "1"
name: RAG
role: knowledge_retrieval

model: moonshot:kimi-k2.7-code
# api_endpoint: POST https://api.moonshot.ai/v1/chat/completions
api_key_env: KIMI_API_KEY
think_level: high
effort: high

token_budget:
  max_prompt: 16384
  max_completion: 8192

tasks:
  - id: hybrid_retrieval
    description: >-
      Retrieve passages for a query with dense and sparse search, fuse the
      rankings, and return a grounded context with provenance.
    outputs:
      - provenance_context
      - retrieval_metrics

  - id: semantic_caching
    description: >-
      Decide whether a query can be served from a semantic cache, and state
      the hit rule, the miss path, and what must not be cached.
    outputs:
      - cache_decision
      - cache_policy

  - id: ingest_and_chunk
    description: >-
      Structure-aware markdown/AST chunking with overlap, SHA-256 ids, and
      index write via rag_ingest (FAISS / NumPy fallback).
    outputs:
      - chunks
      - index_uri

  - id: rerank_and_pack
    description: >-
      Cross-encoder rerank Top-K1 to Top-K2 and Lost-in-the-Middle pack
      within the token budget.
    outputs:
      - packed_context
      - scores

  - id: adaptive_crag
    description: >-
      When max score is low or the pool is empty, run DarS (HyDE, step-back,
      then an authorized public-source lookup through Agent Reach when available
      or web search / WebResearcher) and return CRAG CORRECT / INCORRECT / AMBIGUOUS.
    outputs:
      - crag_assessment
      - fallback

capabilities:
  - retrieval
  - web_search
  - semantic_cache
  - citation
