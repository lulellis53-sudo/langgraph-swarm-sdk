version: "1"
name: RAG
role: knowledge_retrieval

model: inherit
think_level: high
effort: high

token_budget:
  max_prompt: 16384
  max_completion: 8192

tasks:
  - id: hybrid_retrieval
    description: >-
      Retrieve passages for a query with dense and sparse search, fuse the
      rankings, and return a grounded context with provenance.
    outputs:
      - provenance_context
      - retrieval_metrics

  - id: semantic_caching
    description: >-
      Decide whether a query can be served from a semantic cache, and state
      the hit rule, the miss path, and what must not be cached.
    outputs:
      - cache_decision
      - cache_policy

capabilities:
  - retrieval
  - semantic_cache
  - citation
