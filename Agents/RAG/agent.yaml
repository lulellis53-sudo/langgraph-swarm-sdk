version: "1"
name: RAG
role: knowledge_retrieval
description: "Autonomous RAG & Knowledge Retrieval Specialist for semantic caching, hybrid dense-sparse search, reciprocal rank fusion, cross-encoder reranking, and citation grounding."

model: inherit
think_level: high
effort: high

token_budget:
  max_prompt: 16384
  max_completion: 8192

tasks:
  - id: hybrid_retrieval
    description: >-
      Execute hybrid dense and sparse retrieval with Reciprocal Rank Fusion,
      cross-encoder probability calibration, and lost-in-the-middle context packing.
    outputs:
      - provenance_context
      - retrieval_metrics
      - crag_assessment

  - id: semantic_caching
    description: >-
      Query the semantic cache for sub-2ms hit latency and manage threshold-gated eviction.
    outputs:
      - cache_hit_payload

capabilities:
  - view_file
  - write_to_file
  - replace_file_content
  - send_message
