version: "1"
name: Summarizer
role: summarize_score

model: inherit

token_budget:
  max_prompt: 16384
  max_completion: 512

capabilities:
  - extractive_summary
  - semantic_score

tasks:
  - id: summarize_score
    description: >-
      Extractive summary and semantic score of each clean document against
      the query (WebSearch/backend/semantic.py summarize_score); return a
      short ranked summary.
    outputs:
      - summary
