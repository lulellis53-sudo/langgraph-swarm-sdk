version: "1"
name: Reviewer
role: review_changes

model: openai:gpt-4o
think_level: high
effort: high
api_key_env: SWARM_REVIEWER_API_KEY

token_budget:
  max_prompt: 8192
  max_completion: 2048

tasks:
  - id: diff_review
    description: >-
      Review a diff or PR for correctness, security, style, and test
      coverage; emit structured findings with severity.
    outputs:
      - findings
      - verdict

  - id: security_smell_check
    description: >-
      Scan a diff for security smells: injection, secret exposure,
      unsafe deserialization, OWASP Top 10.
    outputs:
      - security_findings
      - severity_map

capabilities:
  - diff_reading
  - static_analysis
  - security_patterns
  - lint
