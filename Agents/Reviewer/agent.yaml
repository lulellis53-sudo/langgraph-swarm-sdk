version: "1"
name: Reviewer
role: review_changes
# Wire this persona into the handoff swarm: swarm_sdk.core.swarm builds one
# create_agent node per manifest whose langgraph_node is set.
langgraph_node: reviewer

model: anthropic:claude-sonnet-4.6
# api_endpoint: POST https://api.anthropic.com/v1/messages
think_level: high
effort: high
api_key_env: CLAUDE_OAUTH_TOKEN

token_budget:
  max_prompt: 8192
  max_completion: 2048

tasks:
  - id: diff_review
    description: >-
      Review a diff or PR for correctness, security, style, and test
      coverage; emit structured findings with severity.
    outputs:
      - findings
      - verdict

  - id: security_smell_check
    description: >-
      Scan a diff for security smells: injection, secret exposure,
      unsafe deserialization, OWASP Top 10.
    outputs:
      - security_findings
      - severity_map

  - id: pydantic_schema_check
    description: >-
      Flag public Python APIs that use untyped dict/dataclass payloads
      instead of pydantic.BaseModel v2; emit file/line findings for Coder
      to apply in the listed .py files. Do not edit files.
    outputs:
      - findings
      - verdict

capabilities:
  - web_search
  - ast
  - diff_reading
  - static_analysis
  - security_patterns
  - lint
