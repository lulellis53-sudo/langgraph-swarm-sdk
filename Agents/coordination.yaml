# Task board — replace with tasks for the active project.
# Each task must have: id, title, assigned agent(s), depends_on, and status.
# Coder tasks that share a wave also need disjoint files (and usually task).
# Example structure:
#
# tasks:
#   - id: T01
#     title: "Discover: read codebase and map key modules"
#     assigned: [Researcher]
#     depends_on: []
#     status: todo
#
#   - id: T02
#     title: "Plan: decompose goal into implementation tasks"
#     assigned: [Planner]
#     depends_on: [T01]
#     status: todo
#
#   - id: T03
#     title: "Implement: module A (exclusive files)"
#     assigned: [Coder]
#     task: implement_in_files
#     files: [src/a.py, tests/test_a.py]
#     depends_on: [T02]
#     status: todo
#
#   - id: T04
#     title: "Implement: module B (disjoint files, same wave as T03)"
#     assigned: [Coder]
#     task: implement_in_files
#     files: [src/b.py, tests/test_b.py]
#     depends_on: [T02]
#     status: todo
#
#   - id: T05
#     title: "Test: write and run tests for T03+T04"
#     assigned: [Tester]
#     depends_on: [T03, T04]
#     status: todo
#
#   - id: T06
#     title: "Review: diff review for T03+T04"
#     assigned: [Reviewer]
#     depends_on: [T05]
#     status: todo

tasks:
  - id: MD01
    title: "Route: pick provider/model for a sub-task"
    assigned: [ModelDelegate]
    task: route_task
    depends_on: []
    status: todo

  - id: MD02
    title: "Fallback: pre-compute retry chain for the selected route"
    assigned: [ModelDelegate]
    task: resolve_fallback
    depends_on: [MD01]
    status: todo

  - id: MD03
    title: "Embed: dispatch embedding task to GPU or registry provider"
    assigned: [ModelDelegate]
    task: delegate_embedding
    depends_on: []
    status: todo

  - id: MD04
    title: "Math: dispatch numerical task to GPU or fast LLM"
    assigned: [ModelDelegate]
    task: delegate_math
    depends_on: []
    status: todo

  - id: MD05
    title: "Math: solve a problem end to end with LaTeX result and verification script"
    assigned: [ModelDelegate]
    task: solve_math
    depends_on: []
    status: todo

  - id: MD06
    title: "Math: computationally verify a mathematical claim"
    assigned: [ModelDelegate]
    task: verify_math
    depends_on: []
    status: todo

  - id: websearch_pipeline
    title: "WebSearch: search/scrape pipeline and offline tests"
    assigned: [WebFetch]
    task: fetch_render
    depends_on: []
    status: in_progress

  - id: prediction_forecast
    title: "Prediction: mlforecast engine and forecast extra"
    assigned: [Prediction]
    task: forecast_series
    depends_on: []
    status: done

  - id: newsletter_mvp
    title: "Newsletter: offline digest MVP and tests"
    assigned: [Newsletter]
    task: newsletter_mvp
    depends_on: []
    status: in_progress

  - id: CR01
    title: "Reviewer: Pydantic v2 schema check on selected Python modules"
    assigned: [Reviewer]
    task: pydantic_schema_check
    files:
      - WebSearch/digest.py
      - WebSearch/forecast.py
      - WebSearch/cli.py
      - src/swarm_sdk/retrieval/rag_ingest.py
    depends_on: []
    status: todo

  - id: CR02
    title: "Coder: apply Reviewer Pydantic findings in claimed .py files"
    assigned: [Coder]
    task: implement_in_files
    files:
      - WebSearch/digest.py
      - WebSearch/forecast.py
      - WebSearch/cli.py
      - src/swarm_sdk/retrieval/rag_ingest.py
    depends_on: [CR01]
    status: todo

  - id: DB01
    title: "Test: SQLite vector fallback resumes IDs after reopening"
    assigned: [Coder]
    task: add_tests
    files:
      - Agents/benchmark/tests/test_memory.py
    depends_on: []
    status: done
