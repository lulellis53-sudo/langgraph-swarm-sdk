version: "1"
name: ModelDelegate
role: model_delegation

model: openrouter:z-ai/glm-5.3-flash
think_level: medium
effort: low
api_key_env: OPENROUTER_API_KEY

token_budget:
  max_prompt: 4096
  max_completion: 1024

tasks:
  - id: route_task
    description: >-
      Pick the best model/provider route for a given task, think level, and optional provider hint.
    outputs:
      - selected_route
      - fallback_routes

  - id: resolve_fallback
    description: >-
      Retry a failed task across the fallback chain until success or exhaustion.
    outputs:
      - selected_route
      - attempts

  - id: delegate_embedding
    description: >-
      Dispatch an embedding or vector-store task to the GPU backend when available.
    outputs:
      - selected_route
      - gpu_enabled

  - id: delegate_math
    description: >-
      Dispatch a numerical or linear-algebra task to the GPU math backend when available.
    outputs:
      - selected_route
      - gpu_enabled

capabilities:
  - route
  - fallback
  - gpu_embedding
  - gpu_math
