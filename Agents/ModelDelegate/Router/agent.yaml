version: "1"
name: ModelDelegate/Router
role: route_task

model: openrouter:z-ai/glm-5.3-flash
think_level: low
effort: low
api_key_env: OPENROUTER_API_KEY

token_budget:
  max_prompt: 2048
  max_completion: 512

tasks:
  - id: route_task
    description: >-
      Select the best model route for a task from the model registry.
    outputs:
      - selected_route
      - fallback_routes

capabilities:
  - route
  - registry_lookup
