version: "1"
name: ModelDelegate/MathWorker
role: delegate_math

model: mistral:ministral-3-8b-latest
think_level: low
effort: low
api_key_env: MISTRAL_API_KEY_2

token_budget:
  max_prompt: 2048
  max_completion: 512

tasks:
  - id: delegate_math
    description: >-
      Choose GPU or registry provider for a numerical/linear-algebra task.
    outputs:
      - selected_route
      - gpu_enabled
      - backend

capabilities:
  - gpu_math
  - registry_lookup
