version: "1"
name: ModelDelegate/FallbackResolver
role: resolve_fallback

model: sambanova:Meta-Llama-3.3-70B-Instruct
think_level: medium
effort: medium
api_key_env: SAMBANOVA_API_KEY

token_budget:
  max_prompt: 4096
  max_completion: 1024

tasks:
  - id: resolve_fallback
    description: >-
      Retry a failed LLM call across the fallback chain until success or exhaustion.
    outputs:
      - result
      - selected_route
      - attempts

capabilities:
  - fallback
  - circuit_breaker
