version: "1"
name: Tester
role: write_and_run_tests

model: openai:gpt-4o-mini
think_level: medium
effort: medium
api_key_env: SWARM_TESTER_API_KEY

token_budget:
  max_prompt: 4096
  max_completion: 1024

tasks:
  - id: write_tests
    description: >-
      Write unit, integration, or property-based tests for a given module
      or behavior.
    outputs:
      - test_files
      - coverage_delta

  - id: run_gate
    description: >-
      Execute the full test suite, report failures, and classify each as
      flaky, regression, or newly introduced.
    outputs:
      - gate_result
      - failure_classification

capabilities:
  - pytest
  - hypothesis
  - coverage
  - test_runner
