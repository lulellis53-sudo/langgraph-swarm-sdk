version: '1'
name: DeepResearch
role: deep_technical_research
langgraph_node: researcher
model: anthropic:claude-sonnet-4.6
think_level: high
effort: high
api_key_env: CLAUDE_OAUTH_TOKEN
token_budget:
  max_prompt: 16384
  max_completion: 8192
tasks:
- id: deep_technical_investigation
  description: Execute multi-hop primary source retrieval, SearXNG / web search, and
    evidence graph assembly; synthesize publication-grade research dossiers and write
    directly to destination .md file.
  outputs:
  - synthesis_report
  - evidence_ledger
  - output_file_path
- id: source_verification
  description: Perform zero-hallucination URL liveness checks via read_url_content
    and audit claims against primary documentation.
  outputs:
  - verification_report
  - citation_list
- id: adaptive_web_search
  description: 'Execute deep web research using strict extraction hierarchy (Context7 -> Tavily/Exa -> Google fallback) with adaptive time budgeting (Tier A/B/C) and live URL validation.'
  outputs:
  - research_dossier
  - evidence_ledger
capabilities:
- web_search
- read_url_content
- citation
- synthesis
- file_writer
- argus_evidence_graph
- context7_lookup
- tavily_search
- playwright_inspection
- url_liveness_check
skills:
- skills/SKILL.md
telemetry:
  enabled: true
  metrics:
  - token_count
  - latency_ms
  - throughput_rpm
  - jev_score
  - success_rate
  export_format: json_lines
  log_destination: Benchmarks/telemetry.jsonl
