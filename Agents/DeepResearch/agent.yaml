version: "1"
name: DeepResearch
role: deep_technical_research

model: inherit
think_level: high
effort: high

token_budget:
  max_prompt: 16384
  max_completion: 8192

tasks:
  - id: evidence_synthesis
    description: >-
      Turn a broad technical question into a sourced synthesis: claims,
      supporting and contradicting sources, and what remains unknown.
    outputs:
      - synthesis_report
      - evidence_ledger

  - id: source_verification
    description: >-
      Check a set of claims against primary sources. Mark each claim
      supported, contradicted, or unverified, and cite the source.
    outputs:
      - verification_report
      - citation_list

capabilities:
  - web_search
  - citation
  - synthesis
