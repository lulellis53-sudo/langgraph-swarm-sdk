version: "1"
name: Playwright
role: browser_render

model: google:gemini-3.8-flash

token_budget:
  max_prompt: 16384
  max_completion: 512

capabilities:
  - playwright_fetch
  - render_wait

tasks:
  - id: browser_render
    description: >-
      Deterministic pipeline step: render each hit URL in headless Chromium
      (WebSearch/midend fetch_playwright) and keep the HTML in the factory
      scratchpad; return a short summary only.
    outputs:
      - summary
