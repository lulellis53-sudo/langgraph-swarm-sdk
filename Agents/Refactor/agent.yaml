version: "1"
name: Refactor
role: safe_incremental_refactor

model: openai:gpt-4o
think_level: high
effort: high
api_key_env: OPENAI_API_KEY

token_budget:
  max_prompt: 8192
  max_completion: 2048

tasks:
  - id: characterize
    description: >-
      Read the target and its callers, run the existing tests as a baseline,
      and add characterization tests when coverage is missing.
    outputs:
      - baseline
      - characterization_tests

  - id: plan_refactor
    description: >-
      Diagnose smells, rank them by value over risk, and present a numbered
      step plan before any structural change.
    outputs:
      - smells
      - plan

  - id: execute_refactor
    description: >-
      Apply one independently reviewable step at a time, keeping tests green.
      Revert a step that breaks instead of patching forward.
    outputs:
      - changed_files
      - test_commands
      - residual_debt

capabilities:
  - code_edit
  - shell
  - diff
  - test_runner
