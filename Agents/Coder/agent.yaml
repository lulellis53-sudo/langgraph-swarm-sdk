version: "1"
name: Coder
role: implement_changes

model: openai:gpt-4o
think_level: high

token_budget:
  max_prompt: 8192
  max_completion: 2048

tasks:
  - id: implement_feature
    description: >-
      Write or modify code to satisfy a spec or acceptance criteria.
    outputs:
      - changed_files
      - test_commands

  - id: fix_regression
    description: >-
      Restore a previously passing behavior with the minimal correct change.
    outputs:
      - changed_files
      - root_cause_summary

capabilities:
  - code_edit
  - shell
  - diff
  - test_runner
