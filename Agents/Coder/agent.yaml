version: '1'
name: Coder
role: implement_changes
langgraph_node: coder
model: anthropic:claude-sonnet-4.6
think_level: high
effort: high
api_key_env: CLAUDE_OAUTH_TOKEN
token_budget:
  max_prompt: 8192
  max_completion: 2048
tasks:
- id: implement_feature
  description: Write or modify code across Python, Rust, C/C++, Golang, Node.js, and
    TypeScript to satisfy a spec. When files is set, write only those paths; when
    empty, stay in claimed scope.
  outputs:
  - claimed_files
  - changed_files
  - test_commands
  - parallel_safe
- id: implement_in_files
  description: Implement only in exclusive files claimed for this step. Safe to run
    concurrently with non-overlapping steps.
  outputs:
  - claimed_files
  - changed_files
  - test_commands
  - parallel_safe
- id: fix_regression
  description: Restore previously passing behavior with minimal correct change across
    any supported language toolchain.
  outputs:
  - claimed_files
  - changed_files
  - root_cause_summary
  - parallel_safe
- id: add_tests
  description: Add or update unit/regression tests covering production files.
  outputs:
  - claimed_files
  - changed_files
  - test_commands
capabilities:
- code_edit
- shell
- diff
- test_runner
- file_scoped
- parallel
- multi_language_coding
- python_rust_cpp_golang_node_ts
skills:
- skills/SKILL.md
- skills/JSCoder/SKILL.md
- skills/RustCoder/SKILL.md
telemetry:
  enabled: true
  metrics:
  - token_count
  - latency_ms
  - throughput_rpm
  - jev_score
  - success_rate
  export_format: json_lines
  log_destination: Benchmarks/telemetry.jsonl
