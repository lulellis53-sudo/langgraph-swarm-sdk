version: "1"
name: Optimizer
role: performance_tuning

model: openai:gpt-4o-mini
api_key_env: OPENAI_API_KEY
think_level: medium

token_budget:
  max_prompt: 4096
  max_completion: 1024

tasks:
  - id: profile_hotpath
    description: >-
      Profile an execution path and identify the single largest bottleneck
      with supporting measurement data.
    outputs:
      - profiling_report
      - bottleneck_location

  - id: apply_optimization
    description: >-
      Apply a targeted optimization to the identified bottleneck and
      measure the before/after performance delta.
    outputs:
      - changed_files
      - benchmark_delta

capabilities:
  - profiling
  - benchmarking
  - token_counting
  - caching
