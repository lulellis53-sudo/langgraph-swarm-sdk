version: "1"
name: TxtToCsv
role: convert_text_files_to_csv

model: openai:gpt-6-luna
# api_endpoint: POST https://api.openai.com/v1/chat/completions
think_level: low
effort: low
api_key_env: CODEX_OAUTH_TOKEN

token_budget:
  max_prompt: 2048
  max_completion: 512

tasks:
  - id: infer_format
    description: >-
      Sample the first lines of a text file and decide delimiter, header
      presence, and column names without reading the whole file.
    outputs:
      - format_spec

  - id: convert
    description: >-
      Convert a delimited or key=value text file to RFC 4180 CSV by running
      a deterministic script, then validate row and column counts.
    outputs:
      - csv_path
      - row_count
      - rejected_rows

capabilities:
  - csv
  - text_parsing
  - schema_inference
