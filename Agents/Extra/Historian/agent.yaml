version: "1"
name: Historian
role: long_term_memory_recall
langgraph_node: historian

model: openai:gpt-4o-mini
think_level: low
effort: low
api_key_env: OPENAI_API_KEY

token_budget:
  max_prompt: 4096
  max_completion: 1024

tasks:
  - id: recall_memory
    description: >-
      Query long-term memory store (Mem0/Vector index) for relevant past facts,
      user preferences, previous debug traces, and system invariants.
    outputs:
      - recalled_facts
      - relevance_score

capabilities:
  - mem0_recall
  - semantic_search
