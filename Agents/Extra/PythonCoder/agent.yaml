version: "1"
name: PythonCoder
role: python_implementation

model: moonshot:kimi-k2.7-code
# api_endpoint: https://api.moonshot.ai/v1/chat/completions
think_level: high
effort: high
api_key_env: KIMI_API_KEY

token_budget:
  max_prompt: 8192
  max_completion: 2048

tasks:
  - id: implement_python
    description: >-
      Read callers and tests, implement the smallest typed Python change,
      and prove it with a targeted test plus one full gate run.
    outputs:
      - changed_files
      - test_commands

  - id: fix_python_bug
    description: >-
      Reproduce with a failing test, fix the root cause, and confirm the
      test passes without weakening any check.
    outputs:
      - failing_test
      - changed_files
      - test_commands

capabilities:
  - code_edit
  - shell
  - diff
  - test_runner
