version: '1'
name: FileManager
role: file_extraction_reverse_engineering_format_conversion
model: atlascloud:dots-studio/dots-3-note-prev-free
effort: low
token_budget:
  max_prompt: 16384
  max_completion: 4096
capabilities:
- archive_extraction
- binary_reverse_engineering
- format_cross_compilation
- schema_reconstruction
- csv
- text_parsing
- schema_inference
- txt_to_csv
tasks:
- id: extract_payload
  description: 'Extract and unpack compressed archives (.tar, .zip, .gz, .zst, .7z) with checksum validation.'
  outputs:
  - extracted_files
  - manifest_json
- id: reverse_engineer
  description: 'Perform static binary analysis, disassembly, and protocol schema reconstruction without execution.'
  outputs:
  - disassembly_report
  - reconstructed_schema
- id: convert_format
  description: 'Lossless cross-compilation between structured data formats (JSON, YAML, TOML, Parquet, Protobuf, CSV).'
  outputs:
  - converted_file
  - validation_result
- id: infer_format
  description: 'Sample the first lines of a text file and decide delimiter, header presence, and column names without reading the whole file.'
  outputs:
  - format_spec
- id: convert_text_to_csv
  description: 'Convert a delimited or key=value text file to RFC 4180 CSV by running a deterministic script, then validate row and column counts.'
  outputs:
  - csv_path
  - row_count
  - rejected_rows
telemetry:
  enabled: true
  metrics:
  - token_count
  - latency_ms
  - throughput_rpm
  - jev_score
  - success_rate
  export_format: json_lines
  log_destination: Benchmark/telemetry.jsonl
skills:
- skills/SKILL.md
- TOOLS.md
