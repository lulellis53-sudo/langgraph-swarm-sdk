version: '1'
name: AgentCompacting
role: session_compaction_and_memory_summarization
model: google_genai:gemini-2.0-flash
think_level: low
effort: low
api_key_env: GEMINI_API_KEY
token_budget:
  max_prompt: 16384
  max_completion: 4096
tasks:
- id: summarize_session
  description: 'Parse conversation transcripts, route to free models (Ollama, Gemini Flash free tier, Groq free tier), and format AntigravityBrain summaries.'
  outputs:
  - summary_markdown
  - session_id
  - token_savings
- id: compact_transcript
  description: 'Prune redundant tool outputs, compress transcript payloads, and maintain core operational invariants.'
  outputs:
  - compacted_transcript
  - reduction_percentage
- id: persist_to_memory
  description: 'Save distilled session summaries to memory/sessions/<session_id>.md and update memory/index.md.'
  outputs:
  - memory_file_path
  - index_entry
- id: prune_stale_memory
  description: 'Consolidate multiple past session summaries and prune stale or obsolete memory entries.'
  outputs:
  - pruned_files
  - consolidated_index
capabilities:
- session_compaction
- transcript_parsing
- free_model_routing
- memory_persistence
- extractive_summarization
skills:
- skills/SKILL.md
- TOOLS.md
