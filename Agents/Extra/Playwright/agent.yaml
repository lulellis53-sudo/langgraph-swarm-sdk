version: '1'
name: Playwright
role: browser_decision_and_llm
model: groq:openai/gpt-oss-20b
api_key_env: GROQ_API_KEY
effort: medium
token_budget:
  max_prompt: 16384
  max_completion: 1024
capabilities:
- playwright_browse
- llm_model_manage
- hit_critique
- text_critique
- self_learn
- normalize_llm
- summarize_llm
ownership:
  sole_consumer: Websearcher
  note: >-
    Only the Websearcher agent may invoke the Playwright tool. Every other
    agent routes browsing through Websearcher; this persona is the tool's
    owner-manager, not a general-purpose browser.
llm_models:
  playwright_manager: groq:openai/gpt-oss-120b
  normalize: groq:openai/gpt-oss-20b
  summarize: groq:openai/gpt-oss-20b
tasks:
- id: browse_decide
  description: 'Decide whether to render a URL in headless Chromium or return early, then extract main text. The decision (static fetch vs Playwright vs skip) is returned with the content.'
  outputs:
  - decision
  - extracted_text
- id: critique_hits
  description: 'Score and critique a batch of search hits for relevance and source quality; feed the rubric back into the self-learning store.'
  outputs:
  - critiqued_hits
  - rubric_update
- id: normalize_summarize
  description: 'Run the Groq normalize pass then the Groq summarize pass over extracted text; output is never longer than input (token-saving, fail-open).'
  outputs:
  - normalized_text
  - summary
telemetry:
  enabled: true
  metrics:
  - token_count
  - latency_ms
  - throughput_rpm
  - jev_score
  - success_rate
  export_format: json_lines
  log_destination: Benchmarks/telemetry.jsonl
skills:
- skills/SKILL.md
