version: 1
agent: MLSpecialist
role: model_selection_and_integration
models:
  primary:
    name: google:gemini-3.8-flash
    provider: google
    api_key_env: GEMINI_API_KEY
    think_level: high
    effort: high
    token_budget:
      max_prompt: 8192
      max_completion: 4096
  fallback:
    name: nvidia:nemotron-3.5-lightning-30b-a3b
    provider: nvidia
    api_key_env: NVIDIA_NIM_API_KEY
    base_url_env: NVIDIA_BASE_URL
    think_level: medium
    effort: low
    token_budget:
      max_prompt: 4096
      max_completion: 2048
fallback_chain:
  order:
  - primary
  - fallback
  circuit_breaker:
    failure_threshold: 3
    recovery_time_sec: 60
  timeout_ms: 30000
