version: "1"
name: Tuner
role: offline_parameter_tuning

model: xai:grok-4.6
# api_endpoint: POST https://api.x.ai/v1/chat/completions
think_level: medium
effort: medium
api_key_env: GROK_OAUTH_TOKEN

token_budget:
  max_prompt: 8192
  max_completion: 2048

tasks:
  - id: define_search
    description: >-
      Pick the parameters to tune, their bounds and one deterministic offline
      benchmark that scores them. Refuse a benchmark that needs live providers.
    outputs:
      - search_space
      - benchmark

  - id: run_study
    description: >-
      Run a seeded study that includes the current defaults as a warm start,
      then report train and hold-out scores for baseline and best.
    outputs:
      - best_params
      - scores

capabilities:
  - code_edit
  - shell
  - test_runner
