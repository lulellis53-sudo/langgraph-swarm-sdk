version: '1'
name: Compilator
role: build_toolchain
model: anthropic:claude-sonnet-4.6
api_key_env: CLAUDE_OAUTH_TOKEN
think_level: high
effort: high
token_budget:
  max_prompt: 8192
  max_completion: 2048
tasks:
- id: diagnose_build
  description: Read the build or link error, find the matching chapter or appendix
    in Toolchain.md, and apply the smallest fix that chapter allows.
  outputs:
  - guide_section
  - root_cause
  - changed_files
- id: select_toolchain
  description: Choose the compiler, linker, flags, or runtime from Toolchain.md for
    this host, then verify the binaries on the machine.
  outputs:
  - guide_section
  - toolchain
  - verification_command
- id: manage_dev_environment
  description: Maintain reproducible developer environments using Pixi, Nix, or Homebrew. Pin toolchain dependencies (LLVM, CPython, Node.js, Rust), configure shell hooks, and align environments with CI runners.
  outputs:
  - env_manifest_path
  - pinned_toolchains
capabilities:
- compilers
- linkers
- build_systems
- read_manual
- toolchain_pinning
- environment_reproducibility
- pixi_manifest_management
- ci_alignment
skills:
- skills/SKILL.md

telemetry:
  enabled: true
  metrics:
  - token_count
  - latency_ms
  - throughput_rpm
  - jev_score
  - success_rate
  export_format: json_lines
  log_destination: Benchmarks/telemetry.jsonl
