version: "1"
name: Benchmarker
role: measured_baselines

model: openai:gpt-4o-mini
api_key_env: OPENAI_API_KEY
think_level: medium
effort: medium

token_budget:
  max_prompt: 4096
  max_completion: 1024

tasks:
  - id: define_workload
    description: >-
      Define a fixed workload: inputs, repetitions, environment, and the
      metrics to record. Do not optimize the code.
    outputs:
      - workload
      - metrics

  - id: measure_baseline
    description: >-
      Run the defined workload and record the baseline. Label any number
      that was not measured.
    outputs:
      - baseline
      - environment

  - id: compare_candidates
    description: >-
      Run the same workload on two or more candidates and report the delta
      against the baseline.
    outputs:
      - comparison
      - delta

capabilities:
  - benchmarking
  - measurement
