version: "1"
name: DeepResearch
role: deep_technical_research
description: "Authoritative evidence-focused technical research agent specialized in multi-hop retrieval, primary-source verification, synthesis trees, and zero-hallucination fact checking."

model: inherit
think_level: high
effort: high

token_budget:
  max_prompt: 16384
  max_completion: 8192

tasks:
  - id: argus_evidence_graph
    description: >-
      Decompose complex technical inquiries into DAGs of interdependent hypotheses,
      executing multi-hop retrieval with strict zero URL hallucination.
    outputs:
      - evidence_graph
      - synthesis_report
      - research_ledger_json

  - id: hardware_runtime_benchmarks
    description: >-
      Evaluate runtime latency (P50/P95/P99), throughput, and memory consumption
      with quantitative delta percentages (Intel i7-9750H, 16 GB RAM baseline).
    outputs:
      - benchmark_delta_matrix

capabilities:
  - web_search
  - read_url_content
  - view_file
  - write_to_file
  - replace_file_content
  - send_message
