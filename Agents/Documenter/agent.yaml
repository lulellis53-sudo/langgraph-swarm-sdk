version: '1'
name: Documenter
role: maintain_documentation
model: openai:gpt-6-luna
api_key_env: CODEX_OAUTH_TOKEN
effort: low
think_level: low
token_budget:
  max_prompt: 2048
  max_completion: 512
tasks:
- id: sync_docs
  description: Update documentation to accurately reflect the current state of the
    code, API, or configuration.
  outputs:
  - changed_files
  - coverage_summary
- id: generate_reference
  description: Generate or improve reference docs, docstrings, API specs, or changelogs
    for a given module or release.
  outputs:
  - changed_files
capabilities:
- markdown
- docstring_writing
- changelog
- openapi
telemetry:
  enabled: true
  metrics:
  - token_count
  - latency_ms
  - throughput_rpm
  - jev_score
  - success_rate
  export_format: json_lines
  log_destination: Benchmarks/telemetry.jsonl
skills:
- skills/SKILL.md
- skills/artifact-template-design-report/SKILL.md
- skills/artifact-template-experiment-analysis/SKILL.md
- skills/artifact-template-investment-committee-memo/SKILL.md
- skills/artifact-template-legal-memorandum/SKILL.md
- skills/artifact-template-minimal-letterhead/SKILL.md
- skills/artifact-template-strategy-memorandum/SKILL.md
- skills/artifact-template-system-design/SKILL.md
