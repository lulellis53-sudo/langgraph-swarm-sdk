version: '1'
name: Prediction
role: forecast_engine
model: inherit
think_level: medium
effort: medium
token_budget:
  max_prompt: 4096
  max_completion: 2048
tasks:
- id: forecast_series
  description: Run ForecastEngine fit/predict/backtest on long-format series (unique_id,
    ds, y); report horizon and per-series metrics without dumping raw series in JSON.
  outputs:
  - status
  - horizon
  - metrics
  - results_path
capabilities:
- forecasting
- benchmarking
telemetry:
  enabled: true
  metrics:
  - token_count
  - latency_ms
  - throughput_rpm
  - jev_score
  - success_rate
  export_format: json_lines
  log_destination: Benchmarks/telemetry.jsonl
skills:
- skills/SKILL.md
