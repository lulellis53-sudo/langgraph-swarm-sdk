version: "1"
name: Prediction
role: forecast_engine

model: minimax:minimax-2.7-high-speed
# api_endpoint: POST https://api.minimax.io/v1/chat/completions
api_key_env: MINIMAX_API_KEY
think_level: medium
effort: medium

token_budget:
  max_prompt: 4096
  max_completion: 2048

tasks:
  - id: forecast_series
    description: >-
      Run ForecastEngine fit/predict/backtest on long-format series (unique_id, ds, y);
      report horizon and per-series metrics without dumping raw series in JSON.
    outputs:
      - status
      - horizon
      - metrics
      - results_path

capabilities:
  - forecasting
  - benchmarking
