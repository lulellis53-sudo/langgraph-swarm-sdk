version: '1'
name: DevOps
role: ci_cd_and_environments
model: openai:gpt-6-luna
api_key_env: CODEX_OAUTH_TOKEN
effort: medium
think_level: medium
token_budget:
  max_prompt: 4096
  max_completion: 1024
tasks:
- id: pipeline_green
  description: Diagnose and fix a broken CI/CD pipeline or build failure.
  outputs:
  - changed_files
  - pipeline_run_url
- id: environment_provision
  description: Set up or update a deployment environment, container, or workflow.
  outputs:
  - changed_files
  - verification_command
capabilities:
- web_search
- github_actions
- docker
- shell
- dependency_management
telemetry:
  enabled: true
  metrics:
  - token_count
  - latency_ms
  - throughput_rpm
  - jev_score
  - success_rate
  export_format: json_lines
  log_destination: Benchmarks/telemetry.jsonl
skills:
- skills/SKILL.md
