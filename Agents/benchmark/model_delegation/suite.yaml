# Model Delegation benchmark suite
# Run: uv run pytest benchmark/Tasks/model_delegation -q
#      uv run python -m benchmark.run --task model_delegation
version: "1"
skill: model-delegation
registry: src/swarm_sdk/agents/config/model_registry.yaml

cases:
  - id: route_by_think_level
    description: Router selects the cheapest registry route for each think level
    expected:
      off: xiaomi:mimo-v2.5-pro
      low: xiaomi:mimo-v2.5-pro
      medium: xiaomi:mimo-v2.5-pro
      high: zai:glm-5.3
      xhigh: zai:glm-5.3

  - id: fallback_chain_ready
    description: FallbackChain builds from registry and has circuit breakers
    expected:
      route_count: ">= 5"
      has_breakers: true

  - id: provider_hint
    description: Provider hint restricts route selection
    input:
      think_level: low
      provider: openrouter
    expected:
      selected: openrouter:z-ai/glm-5.3-flash

  - id: requested_providers_present
    description: Registry contains all providers requested by the user
    expected_providers:
      - cohere-1
      - cohere-2
      - mistral-1
      - mistral-2
      - minimax
      - xiaomi
      - claude-code
      - codex
      - moonshot
      - openrouter
      - groq-1
      - groq-2
      - sambanova
      - fireworks

  - id: gpu_dispatch
    description: Embedder and MathWorker prefer GPU when SWARM_GPU_BACKEND is set
    env:
      SWARM_GPU_BACKEND: opencl
    expected:
      gpu_enabled: true
      backend: opencl
