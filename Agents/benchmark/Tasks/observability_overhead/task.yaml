name: observability_overhead
sdk_entry: benchmark.Tasks.observability_overhead.benchmark_observability_overhead.run
metrics:
  - overhead_ns_per_call
  - floor_slot_ms
  - op_slot_ms
units:
  overhead_ns_per_call: "ns (paired median delta vs floor, per call: median_delta_ms x 1e6 / calls_per_slot)"
  floor_slot_ms: "ms per ABBA slot (A = calls_per_slot empty calls)"
  op_slot_ms: "ms per ABBA slot (B = calls_per_slot observed calls)"
models: none (offline; no network, no API keys)
pass:
  all_measured_operations_verified: true
  min_measured_operations: 4
  verdict_labels:
    - B_faster
    - B_slower
    - no_detectable_difference
notes: >-
  No machine-dependent latency thresholds (Benchmark.md noise-floor rule): ns/call
  is reported, never gated. Instrumentation correctness is verified before timing
  (counter deltas, exported span validity, usage rollup, logger level filtering).
