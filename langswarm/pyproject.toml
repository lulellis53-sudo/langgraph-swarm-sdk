[project]
name = "langswarm"
version = "0.3.0"
description = "Twelve-agent LangGraph swarm SDK with RAG, mem0 memory, and LangSmith tracing."
readme = "README.md"
license = "MIT"
requires-python = ">=3.15"
dependencies = [
    # Agents and orchestration
    "langchain>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langchain-community>=0.3",
    "langgraph>=1.0,<2.0",
    "langgraph-swarm>=0.4",
    "langsmith>=0.3",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    # Serving
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "uvloop>=0.21; sys_platform != 'windows'",
    # Logging and terminal
    "loguru>=0.7",
    "rich>=13.9",
    # Serialization and validation
    "orjson>=3.10",
    "msgspec>=0.19",
    "pyyaml>=6.0",
    # HTTP
    "httpx2>=2.0",
    "requests>=2.32",
    # Data and math
    "polars>=1.20",
    "pyarrow>=18.0",
    "numpy>=2.1",
    "sympy>=1.13",
    # Local embeddings (CPU; onnxruntime uses AVX-512 VNNI automatically)
    "fastembed>=0.6",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
    # Local vector backend (default)
    "faiss-cpu>=1.9",
    # Telemetry
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
]

[project.optional-dependencies]
sqlite = ["langgraph-checkpoint-sqlite>=2.0"]
redis = ["langgraph-checkpoint-redis>=2.0", "redis>=5.0"]
postgres = ["langchain-postgres>=0.0.12", "psycopg[binary]>=3.2", "pgvector>=0.3"]
mem0 = ["mem0ai>=0.1"]
rpc = ["grpcio>=1.70", "grpcio-tools>=1.70"]

[project.scripts]
langswarm = "langswarm.cli:main"
langswarm-api = "langswarm.api:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",      # starlette TestClient dependency
    "ruff>=0.9",
    "ty>=0.1",          # Astral type checker
    "lifeguard>=0.1",   # Meta's PEP 810 lazy-import static analyzer
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langswarm"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.src]
include = ["src", "tests", "examples"]

[tool.ty.environment]
python-version = "3.15"
