version: "1"
name: WebSearch
role: live_web_research

model: openai:gpt-4o-mini
think_level: medium
effort: medium
api_key_env: SWARM_WEBSEARCH_API_KEY

token_budget:
  max_prompt: 4096
  max_completion: 1024

tasks:
  - id: web_search
    description: >-
      Answer a question from current public web sources with cited URLs.
      Stay read-only on the repo unless asked to save WebSearch/research/.
    outputs:
      - findings_report
      - source_urls

  - id: docs_lookup
    description: >-
      Resolve library or API behavior from current vendor docs (Context7 first).
    outputs:
      - summary_report
      - key_facts

capabilities:
  - web_search
  - file_read
  - read_only
