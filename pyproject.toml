[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "websearch"
version = "0.1.0"
description = "Parallel web search, crawl/scrape, and extract pipeline (WebSearch worktree)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.3",
    "beautifulsoup4>=4.15.0",
    "curl-cffi>=0.16.3",
    "fastapi>=0.142.2",
    "google-genai>=2.26.0",
    "httpx>=0.28",
    "httpx2>=2.13.1",
    "openai>=3.22.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0",
    "requests>=2.34.2",
    "selectolax>=0.4.13",
    "tavily-python>=0.8.4",
    "trafilatura>=2.2.0",
    "uvloop>=0.21 ; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
    "ty>=0.0.1a0",
]

[tool.uv]
python-preference = "managed"
# google-genai → google-auth needs cryptography; wheels only on this host (no assert.h with LLVM CC).
no-build-package = ["cryptography"]
constraint-dependencies = ["cryptography==48.0.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["."]
extend-exclude = [".venv", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "D"]
"scripts/**/*.py" = ["D"]
"frontend/http.py" = ["ANN401"]
"frontend/models.py" = ["D102"]
"repeater.py" = ["D102"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
mypy-init-return = true
suppress-none-returning = true

[tool.ruff.lint.isort]
known-first-party = ["WebSearch"]

[tool.setuptools]
packages = [
    "WebSearch",
    "WebSearch.frontend",
    "WebSearch.backend",
    "WebSearch.midend",
]
package-dir = { "WebSearch" = ".", "WebSearch.frontend" = "frontend", "WebSearch.backend" = "backend", "WebSearch.midend" = "midend" }

[tool.ty.environment]
python = "./.venv"
python-version = "3.14"

[tool.ty.src]
exclude = ["tests/**", "scripts/**"]

[tool.ty.rules]
unresolved-import = "ignore"
