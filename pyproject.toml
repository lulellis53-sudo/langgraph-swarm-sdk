[project]
name = "websearch"
version = "0.1.0"
description = "Parallel web search, crawl/scrape, and extract pipeline (WebSearch worktree)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
extract = [
    "beautifulsoup4>=4.12",
    "selectolax>=0.3",
    "trafilatura>=2.0",
]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.uv]
python-preference = "managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["."]
extend-exclude = [".venv", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["WebSearch"]
