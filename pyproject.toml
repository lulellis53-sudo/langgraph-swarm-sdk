[project]
name = "langgraph-swarm-sdk"
version = "0.1.0"
description = "Parallel multi-LLM LangGraph swarm with memory, rerankers, tokenizers, and semantic caching."
readme = "README.md"
requires-python = ">=3.14.5"
dependencies = [
    "aiohttp>=3.11",
    "fastapi>=0.115",
    "grpcio>=1.71",
    "grpcio-tools>=1.71",
    "h2>=4.2",
    "httpx2>=2.13",
    "langchain>=1.0",
    "langgraph>=1.0",
    "langgraph-swarm>=0.1",
    "numpy>=2.1",
    "orjson>=3.10",
    "polars>=1.30",
    "protobuf>=6.31",
    "pydantic-settings>=2.10",
    "pydantic>=2.11",
    "requests>=2.32",
    "sqlite-vec>=0.1.6",
    "tokenizers>=0.22",
    "uvicorn>=0.34",
    "uvloop>=0.21; sys_platform != 'win32'",
    # onnxruntime has no macOS x86_64 wheel, so FastEmbed cannot install there.
    "fastembed>=0.7; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[tool.uv]
python-preference = "managed"

[project.optional-dependencies]
dev = [
    "hypothesis>=6.135",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "ruff>=0.12",
    "taplo>=0.9",
    "ty>=0.0.1a0",
    "yamllint>=1.35",
]
faiss = ["faiss-cpu>=1.11"]
# sympy/transformers/onnxruntime: local symbolic math + HF models for rerankers/embeddings.
# onnxruntime has no macOS x86_64 wheel (same constraint as fastembed above).
ml = [
    "sympy>=1.13",
    "transformers>=4.51",
    "onnxruntime>=1.20; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]
qdrant = ["qdrant-client>=1.14"]

[project.scripts]
swarm-api = "swarm_sdk.api:main"
swarm-grpc = "swarm_sdk.grpc_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarm_sdk"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
extend-exclude = ["src/swarm_sdk/pb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ty.src]
exclude = ["src/swarm_sdk/pb/**"]
