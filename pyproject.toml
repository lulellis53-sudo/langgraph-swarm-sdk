[project]
name = "websearch"
version = "0.1.0"
description = "Parallel web search, crawl/scrape, and extract pipeline (WebSearch worktree)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.3",
    "beautifulsoup4>=4.15.0",
    "curl-cffi>=0.16.3",
    "fastapi>=0.142.2",
    "google-genai>=2.26.0",
    "httpx>=0.28",
    "httpx2>=2.13.1",
    "openai>=3.22.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0",
    "requests>=2.34.2",
    "selectolax>=0.4.13",
    "tavily-python>=0.8.4",
    "trafilatura>=2.2.0",
    "uvloop>=0.21 ; sys_platform != 'win32'",
]

[project.optional-dependencies]
extract = [
    "beautifulsoup4>=4.12",
    "selectolax>=0.3",
    "trafilatura>=2.0",
]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.uv]
python-preference = "managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["."]
extend-exclude = [".venv", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["WebSearch"]
